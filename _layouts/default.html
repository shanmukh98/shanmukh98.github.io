<!doctype html>
<html lang="en">
  <head>
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.name }}</title>

    {% include meta.html %}
    <meta name="theme-color" content="#f4f3ee" data-lineframe-theme-color>
    <link rel="icon" href="{{ site.baseurl }}/shanmukh-mark.svg" type="image/svg+xml">
    <script src="{{ site.lineframe_theme_js }}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ site.lineframe_css }}">
    <link rel="stylesheet" href="{{ site.baseurl }}/style.css">
    <link
      rel="alternate"
      type="application/rss+xml"
      title="{{ site.name }} - {{ site.description }}"
      href="{{ site.baseurl }}/feed.xml"
    >
  </head>

  <body
    class="lf-site"
    style="--lf-accent: {{ page.accent | default: site.accent | default: '#526f7d' }};"
  >
    <header class="lf-header">
      <div class="lf-header__inner">
        <a class="lf-brand" href="{{ site.baseurl }}/">
          <img
            class="site-brand-mark"
            src="{{ site.baseurl }}/shanmukh-mark.svg"
            width="24"
            height="24"
            alt=""
            aria-hidden="true"
          >
          {{ site.name }}
        </a>
        <div class="lf-header__actions">
          <nav class="lf-nav" aria-label="Primary navigation">
            <a
              href="{{ site.baseurl }}/"
              {% if page.url == '/' or page.layout == 'post' %}aria-current="page"{% endif %}
            >Writing</a>
            <a
              href="{{ site.baseurl }}/about/"
              {% if page.url == '/about/' %}aria-current="page"{% endif %}
            >About</a>
            <a class="lf-nav__optional" href="{{ site.github_url }}">GitHub</a>
          </nav>
          <button class="lf-theme-toggle" data-lineframe-theme-toggle type="button">
            <span class="lf-theme-toggle__mark" aria-hidden="true"></span>
            <span class="lf-theme-toggle__label" data-lineframe-theme-label>Dark</span>
          </button>
        </div>
      </div>
    </header>

    <main id="content" class="site-main">
      {{ content }}
    </main>

    <footer class="lf-footer">
      <div class="lf-footer__inner">
        <span>&copy; {{ site.time | date: '%Y' }} {{ site.name }}</span>
        <div class="lf-footer__links">
          <a href="{{ site.baseurl }}/feed.xml">RSS</a>
          <a href="{{ site.github_url }}">GitHub</a>
        </div>
      </div>
    </footer>

    {% include analytics.html %}
  </body>
</html>
